# T2: 2v2 team racing, everything as F3 (stronger shadow, small contact cost, no time cost, mixed pool) except
# the scoring: the team with the lower sum of places wins. From F3 (teammate flags added with zero weights,
# 72 -> 77 inputs). Tactics that appear here and not in F3 come from the team objective.
name: t2_team
env: race-weather
init_from: null            # set by the queue: :latest=f3_aggressive
wandb: true
wandb_project: sailstart
gif_every: 150
start_bank:
  num: 4096
  policy: fleet
  sampler: uniform
  seed: 4321
env_params:
  fleet_size: 4
  team_size: 2               # 2v2: boats 0-1 vs 2-3, lower sum of places wins (RRS Appendix D)
  rrs16: true
  current_max_frac: 0.06     # race committee
  shadow_min_factor: 0.6     # was 0.75
  shadow_length_bl: 8.0      # was 6
  contact_cost: 0.25         # was 2.0
  contact_cost_row: 0.1      # was 0.5
  race_legs: 4
  course_beat_length: 400.0
  gate_offset: 60.0
  race_finish_reward: 1.0
  race_rank_reward: 2.0      # pays the team result: every winner +1, every loser -1
  race_time_cost: 0.0        # time does not matter, only the place
  race_shaping: 0.1
  shaping_gamma: 1.0
anneal:                      # [start, end, from, until] (fractions of training)
  race_shaping: [0.1, 0.0, 0.1, 0.5]
opponents: [digital, runs/train/f2_weather_league_20261026-170806#0, runs/train/f2_weather_league_20261026-170806#1, runs/train/f2_weather_league_20261026-170806#2]
ppo:
  num_envs: 2048
  num_steps: 64
  total_timesteps: 300000000
  lr: 0.0003
  gamma: 0.999
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32
  ent_coef: 0.01
  ent_coef_final: 0.002
  hidden: 128
  stagger_steps: 700
  num_seeds: 3
  updates_per_chunk: 10
  kick_coef: 0.0
  opp_frac: 0.75             # three quarters of the races against the pool
  opp_learners: 2            # boats 0-1 (one team) learn, the other team from the pool
  opp_snapshots: 4
  opp_snapshot_every: 100
  opp_mix: true              # each pool boat drawn separately: mixed fleets
