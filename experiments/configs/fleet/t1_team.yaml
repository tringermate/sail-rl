# T1: 2v2 team racing on the same 4 boats as F1, from F1 (teammate flags added with zero weights, 72 -> 77
# inputs). Everything else as F1: only the scoring changes, so tactics that appear here and not in F1 come from
# the team objective (pass-backs, slowing an opponent, mark traps).
name: t1_team
env: race
init_from: runs/train/f1_selfplay_20261026-132023
wandb: true
wandb_project: sailstart
gif_every: 150
start_bank:
  num: 4096
  policy: fleet              # the bundled fleet start policy sails the start for all 4 boats
  sampler: uniform
  seed: 4321
env_params:
  fleet_size: 4
  rrs16: true                # a right-of-way boat that changes course must give room
  team_size: 2               # 2v2: boats 0-1 vs 2-3; lower sum of places wins, tie -> team without first place
  race_legs: 4
  course_beat_length: 400.0
  gate_offset: 60.0
  race_finish_reward: 1.0
  race_rank_reward: 2.0      # now pays the team result: every winner +1, every loser -1
  race_time_cost: 0.0016667  # as solo: speed still pays every second
  race_shaping: 0.1
  shaping_gamma: 1.0
ppo:
  num_envs: 2048             # x 4 boats: 8192 boat-transitions per env step
  num_steps: 64
  total_timesteps: 200000000
  lr: 0.0003
  gamma: 0.999
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32
  ent_coef: 0.01
  ent_coef_final: 0.002
  hidden: 128
  stagger_steps: 700
  num_seeds: 3
  updates_per_chunk: 10
  kick_coef: 0.0
