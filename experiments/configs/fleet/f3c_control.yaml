# F3c: control for T2. F3 trained for another 300M steps with everything as T2 (same env, pool, PPO, shaping
# anneal) except the scoring: each boat's own place, as in F3. T2 and F3c then have the same amount of training,
# so whatever T2 does in team races that F3c does not comes from the team objective, not from more training.
name: f3c_control
env: race-weather
init_from: null            # set by the queue: :latest=f3_aggressive
wandb: true
wandb_project: sailstart
gif_every: 150
start_bank:
  num: 4096
  policy: fleet
  sampler: uniform
  seed: 4321
env_params:
  fleet_size: 4
  rrs16: true
  current_max_frac: 0.06     # race committee
  shadow_min_factor: 0.6
  shadow_length_bl: 8.0
  contact_cost: 0.25
  contact_cost_row: 0.1
  race_legs: 4
  course_beat_length: 400.0
  gate_offset: 60.0
  race_finish_reward: 1.0
  race_rank_reward: 2.0      # zero-sum by own place: winner +1 ... last -1
  race_time_cost: 0.0
  race_shaping: 0.1
  shaping_gamma: 1.0
anneal:                      # [start, end, from, until] (fractions of training), as T2
  race_shaping: [0.1, 0.0, 0.1, 0.5]
opponents: [digital, runs/train/f2_weather_league_20261026-170806#0, runs/train/f2_weather_league_20261026-170806#1, runs/train/f2_weather_league_20261026-170806#2]
ppo:
  num_envs: 2048
  num_steps: 64
  total_timesteps: 300000000
  lr: 0.0003
  gamma: 0.999
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32
  ent_coef: 0.01
  ent_coef_final: 0.002
  hidden: 128
  stagger_steps: 700
  num_seeds: 3
  updates_per_chunk: 10
  kick_coef: 0.0
  opp_frac: 0.75
  opp_learners: 2
  opp_snapshots: 4
  opp_snapshot_every: 100
  opp_mix: true
