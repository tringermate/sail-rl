# The steady-wind racer retrained under the fixed gate rule (the gate mark must be rounded; before, passing
# between the marks completed the run and every racer, digital and RL, turned up in the middle of the gate).
# Fine-tunes gpu_s4k_2048 with the digital racer, which now rounds a gate mark, as a fading teacher.
init_from: runs/train/gpu_s4k_2048_20261026-095733
# Needs sail_env with kickstarting (branch kickstart).
name: gpu_racer_gate
env: race-solo
wandb: true
wandb_project: sailstart
gif_every: 150
teacher: digital            # kickstarting teacher (any sail_env load_agent spec)
start_bank:
  num: 4096
  policy: fleet              # the bundled fleet start policy sails the start
  sampler: uniform
  seed: 4321
env_params:
  race_legs: 4
  course_beat_length: 400.0
  gate_offset: 60.0
  race_time_cost: 0.0016667  # 1/600 per second until finished
  race_finish_reward: 1.0
  race_shaping: 0.1          # x (Phi' - Phi), Phi = -distance to sail by the rounding route / 100 m
  shaping_gamma: 1.0         # undiscounted shaping: a parked boat gets exactly the time cost
ppo:
  num_envs: 2048             # GPU: 32x the races per update ...
  num_steps: 64              # ... with shorter rollouts: batch 131k steps (CPU: 16k)
  total_timesteps: 200000000  # 5x the CPU run's samples, 1530 updates (CPU: 2450)
  lr: 0.0001                 # fine-tuning the previous GPU racer
  gamma: 0.999               # the finish is still worth ~half after a full race (0.997: 12%)
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32        # minibatch 4096
  ent_coef: 0.004
  ent_coef_final: 0.002
  hidden: 128
  stagger_steps: 700
  num_seeds: 3
  updates_per_chunk: 10
  kick_coef: 0.5             # the digital racer (now rounding the gate) as a fading teacher ...
  kick_until: 0.2            # ... gone after 20% of training
