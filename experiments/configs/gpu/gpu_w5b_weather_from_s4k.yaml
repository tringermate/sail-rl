# W5b: weather at GPU scale (2048 envs x 64 steps, 200M steps per seed), current capped at 6% of the wind,
# from the GPU kickstarted racer (gpu_s4k_2048, no weather inputs: widened with zero weights). As W1: lr 3e-4,
# entropy 0.01 -> 0.002.
name: gpu_w5b_weather_from_s4k
env: race-solo-weather
init_from: runs/train/gpu_s4k_2048_20261026-095733
wandb: true
wandb_project: sailstart
gif_every: 150
start_bank:
  num: 4096
  policy: fleet
  sampler: uniform
  seed: 4321
env_params:
  race_legs: 4
  course_beat_length: 400.0
  gate_offset: 60.0
  race_time_cost: 0.0016667
  race_finish_reward: 1.0
  race_shaping: 0.1
  shaping_gamma: 1.0
  current_max_frac: 0.06     # race committee
ppo:
  num_envs: 2048
  num_steps: 64
  total_timesteps: 200000000
  lr: 0.0003
  gamma: 0.999
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32
  ent_coef: 0.01
  ent_coef_final: 0.002
  hidden: 128
  stagger_steps: 700
  num_seeds: 3
  updates_per_chunk: 10
  kick_coef: 0.0
