# Phase 2 run C: run B (easier starts) + staged rules + speed bonus around the gun, 2x longer.
# Rules start easy and tighten to the full rules (3 s window, 90% speed, OCS penalty).
name: solo_v3_staged
env: solo_start
wandb: true
gif_every: 50          # updates between GIFs of seed 0's policy (same start scenario each time)
env_params:
  random_start_time: true
staged_rules:          # easy values; the full values are the env_params above
  easy_until: 0.2      # fraction of training with the easy rules
  full_from: 0.7       # full rules from here on (linear tightening in between)
  easy:
    success_window: 10.0     # any legal crossing T+0..T+10 counts
    success_speed_frac: 0.0  # at any speed
    ocs_penalty: 0.0         # no penalty for being over at first
    speed_bonus: 0.02        # per second of full VMG towards the line, T-10..T+3; fades to 0
ppo:
  num_envs: 512        # large batches: ~2x faster on CPU than 64 envs (measured)
  num_steps: 32
  total_timesteps: 10000000
  lr: 3.0e-4
  anneal_lr: true
  update_epochs: 4
  num_minibatches: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantages: true
  clip_value_loss: true
  hidden: 64
  num_seeds: 5
  updates_per_chunk: 10
  stagger_steps: 70    # desynchronise the 70-step episodes across envs
